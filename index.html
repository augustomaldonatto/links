  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.4s, color 0.4s;
    }

    body.dark-mode {
      background: radial-gradient(circle at top, #2a002a, #000);
      color: #fff;
    }

    body.light-mode {
      background: linear-gradient(135deg, #ffffff, #e5e5e5);
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 340px;
      padding: 22px;
      border-radius: 22px;
      background: linear-gradient(135deg, #3b003b, #8b0000);
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.55);
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    body.light-mode .container {
      background: linear-gradient(135deg, #f4f4f4, #d6d6d6);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .profile-video {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #ff2f2f;
      object-fit: cover;
      animation: pulse 2s infinite;
      margin-bottom: 12px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 17px;
      margin: 6px 0;
      letter-spacing: 1px;
    }

    .description {
      font-size: 14px;
      opacity: 0.85;
      min-height: 24px;
      margin-bottom: 14px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      padding: 14px;
      border-radius: 26px;
      font-weight: bold;
      text-decoration: none;
      color: #fff;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
    }

    .links a.show {
      opacity: 1;
      transform: translateY(0);
    }

    .links a:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 16px rgba(255,0,0,0.6);
    }

    /* LINKS NORMAIS */
    .normal {
      background: linear-gradient(90deg, #ff6f61, #ff9472);
    }

    /* LINKS VIP */
    .vip {
      background: linear-gradient(90deg, #ff0000, #ff6a00);
      box-shadow: 0 0 18px rgba(255, 60, 0, 0.8);
      position: relative;
    }

    .vip::after {
      content: "VIP";
      position: absolute;
      top: -8px;
      right: 14px;
      background: gold;
      color: #000;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
    }

    #toggle-mode {
      position: fixed;
      top: 18px;
      right: 18px;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      background: #ff3333;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>

<body class="dark-mode">
  <button id="toggle-mode">Modo Claro</button>

  <div class="container">
    <video autoplay loop muted playsinline class="profile-video">
      <source src="videoPerfil.mp4" type="video/mp4" />
    </video>

    <h1>AUGUSTO MALDONATTO</h1>
    <p class="description"></p>

    <div class="links" id="links"></div>
  </div>

  <script>
    const links = [
      { url: "https://onlyfans.com/augustomaldonatto", text: "🔥 OnlyFans Exclusivo", class: "vip" },
      { url: "https://privacy.com.br/profile/augustomaldonatto", text: "🔞 Privacy Premium", class: "vip" },
      { url: "https://t.me/motocaquente", text: "✈️ Telegram", class: "normal" },
      { url: "https://x.com/motocaquente", text: "🐦 X", class: "normal" },
      { url: "https://www.instagram.com/motoca.quente", text: "📷 Instagram", class: "normal" }
    ];

    const desc = document.querySelector(".description");
    const container = document.getElementById("links");

    function typeText(text, speed, callback) {
      let i = 0;
      desc.textContent = "";
      (function loop() {
        if (i < text.length) {
          desc.textContent += text.charAt(i++);
          setTimeout(loop, speed);
        } else callback && callback();
      })();
    }

    function showLinks() {
      links.forEach((item, i) => {
        const a = document.createElement("a");
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = item.text;
        a.className = item.class;
        container.appendChild(a);
        setTimeout(() => a.classList.add("show"), i * 350);
      });
    }

    typeText("SERVINDO BEM PARA SERVIR SEMPRE 🔥", 45, showLinks);

    document.getElementById("toggle-mode").onclick = () => {
      document.body.classList.toggle("dark-mode");
      document.body.classList.toggle("light-mode");
    };
  </script>
</body>
