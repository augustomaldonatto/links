
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#100914" />

  <title>Motoca Quente | Conteúdo Exclusivo 🔥</title>

  <meta name="description" content="Acesse minhas plataformas exclusivas e redes sociais. Entre e conecte-se comigo!" />
  <meta name="keywords" content="Motoca Quente, OnlyFans, Privacy, links, conteúdo exclusivo" />
  <meta name="author" content="Motoca Quente" />

  <meta property="og:title" content="Motoca Quente 🔥" />
  <meta property="og:description" content="Minhas plataformas exclusivas e redes sociais. Acesse aqui!" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --background: #100914;
      --card: rgba(29, 17, 35, 0.88);
      --text: #ffffff;
      --muted: #c7b9ce;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #ff315b;
      --accent2: #b54cff;
      --button-text: #ffffff;
      --shadow: rgba(255, 49, 91, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      padding: 88px 18px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;

      font-family: "Poppins", system-ui, sans-serif;
      color: var(--text);

      background-color: var(--background);
      background-image:
        linear-gradient(rgba(8, 5, 12, 0.60), rgba(8, 5, 12, 0.78)),
        radial-gradient(ellipse at 15% 15%, rgba(181, 76, 255, 0.20), transparent 38%),
        radial-gradient(ellipse at 85% 75%, rgba(255, 49, 91, 0.17), transparent 40%);
      background-position: center;
      background-size: cover;
      background-attachment: fixed;

      transition:
        background 0.35s ease,
        color 0.35s ease;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    /* CARTÃO PRINCIPAL */

    .container {
      position: relative;
      width: 100%;
      max-width: 390px;

      padding: 34px 24px 25px;
      overflow: hidden;

      text-align: center;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 30px;

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.22),
        0 0 45px var(--shadow);

      animation: appear 0.7s ease both;

      transition:
        background 0.35s ease,
        box-shadow 0.35s ease;
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 2px;

      background: linear-gradient(
        90deg,
        transparent,
        var(--accent),
        var(--accent2),
        transparent
      );

      box-shadow: 0 0 18px var(--accent2);
    }

    .container::after {
      content: "";
      position: absolute;
      top: -110px;
      left: 50%;

      width: 220px;
      height: 220px;

      transform: translateX(-50%);
      border-radius: 50%;

      background: rgba(181, 76, 255, 0.08);
      filter: blur(45px);

      pointer-events: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* FOTO DE PERFIL */

    .profile-wrapper {
      position: relative;
      z-index: 1;

      width: 126px;
      height: 126px;
      margin: 0 auto 19px;
      padding: 4px;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #ff315b,
        #ff8a5c,
        #b54cff,
        #ff315b
      );

      background-size: 250% 250%;
      animation: borderGlow 5s ease infinite;

      box-shadow:
        0 0 20px rgba(255, 49, 91, 0.28),
        0 0 35px rgba(181, 76, 255, 0.15);
    }

    @keyframes borderGlow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .profile-photo {
      display: block;
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      border: 3px solid var(--card);
      border-radius: 50%;
      background: #24162b;
    }

    /* NOME E DESCRIÇÃO */

    h1 {
      position: relative;
      z-index: 1;

      font-size: clamp(19px, 5vw, 23px);
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: 1.2px;

      overflow-wrap: anywhere;

      background: linear-gradient(
        90deg,
        var(--text),
        #ff8ba3,
        #d5a0ff,
        var(--text)
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 9px;
      margin-bottom: 23px;

      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      letter-spacing: 0.4px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      margin-bottom: 12px;

      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: #36e6a0;
      box-shadow: 0 0 10px rgba(54, 230, 160, 0.8);
    }

    /* LISTA DE BOTÕES */

    .links {
      position: relative;
      z-index: 1;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-button {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
      min-height: 53px;
      padding: 15px 18px;

      border: 1px solid var(--border);
      border-radius: 16px;

      color: var(--button-text);
      text-decoration: none;
      text-align: center;

      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2px;

      cursor: pointer;

      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        filter 0.22s ease,
        background 0.22s ease;
    }

    .link-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.09);

      box-shadow: 0 9px 25px var(--shadow);
    }

    .link-button:active {
      transform: scale(0.98);
    }

    .link-button:focus-visible {
      outline: 3px solid var(--accent2);
      outline-offset: 4px;
    }

    /* BOTÃO PLATAFORMAS */

    .platform-toggle {
      border: none;

      background: linear-gradient(
        110deg,
        #ff315b,
        #ff654f 48%,
        #bd42ee
      );

      box-shadow:
        0 7px 24px rgba(255, 49, 91, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .platform-toggle:hover {
      box-shadow:
        0 10px 30px rgba(255, 49, 91, 0.35),
        0 0 20px rgba(181, 76, 255, 0.2);
    }

    .platform-icon {
      font-size: 17px;
    }

    .arrow {
      position: absolute;
      right: 18px;

      font-size: 13px;
      transition: transform 0.25s ease;
    }

    .platform-toggle[aria-expanded="true"] .arrow {
      transform: rotate(180deg);
    }

    /* MENU INTERNO DAS PLATAFORMAS */

    .platform-menu {
      display: grid;
      grid-template-rows: 0fr;

      opacity: 0;
      visibility: hidden;

      margin-top: -12px;

      transition:
        grid-template-rows 0.35s ease,
        opacity 0.25s ease,
        margin 0.35s ease,
        visibility 0.25s ease;
    }

    .platform-menu-inner {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .platform-menu.open {
      grid-template-rows: 1fr;

      opacity: 1;
      visibility: visible;
      margin-top: 0;
    }

    .platform-link {
      min-height: 49px;
      padding: 13px 16px;
      border-radius: 14px;

      animation: none;
    }

    .onlyfans {
      background: linear-gradient(110deg, #168aff, #0064d9);
      box-shadow: 0 5px 18px rgba(0, 119, 255, 0.16);
    }

    .privacy {
      background: linear-gradient(110deg, #9b35ee, #6521c8);
      box-shadow: 0 5px 18px rgba(155, 53, 238, 0.17);
    }

    /* REDES SOCIAIS */

    .social {
      color: var(--text);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--border);
    }

    .social:hover {
      border-color: rgba(181, 76, 255, 0.5);
      box-shadow: 0 7px 22px rgba(181, 76, 255, 0.12);
    }

    /* RODAPÉ */

    .footer {
      position: relative;
      z-index: 1;

      margin-top: 24px;
      padding-top: 17px;

      border-top: 1px solid var(--border);

      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
    }

    .footer span {
      color: var(--accent);
    }

    /* CELULARES */

    @media (max-width: 420px) {
      body {
        padding: 78px 13px 25px;
      }

      .container {
        padding: 29px 19px 22px;
        border-radius: 25px;
      }

      .profile-wrapper {
        width: 116px;
        height: 116px;
      }

      .link-button {
        min-height: 51px;
        padding: 14px;
      }
    }

    /* ACESSIBILIDADE: REDUZ ANIMAÇÕES SE SOLICITADO */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body class="dark-mode">

  <main class="container">

  <script>
    // LOCALIZA AS IMAGENS COM OU SEM EXTENSÃO
    // Testa arquivos sem extensão, JPG, JPEG, PNG e WEBP.

    function loadImageWithFallback(element, baseName, isBackground = false) {
      const extensions = [
        "",
        ".jpg",
        ".jpeg",
        ".png",
        ".webp",
        ".JPG",
        ".PNG"
      ];

      let index = 0;

      function tryNext() {
        if (index >= extensions.length) {
          console.error("Imagem não encontrada:", baseName);
          return;
        }

        const path = baseName + extensions[index++];
        const test = new Image();

        test.onload = function () {
          if (isBackground) {
            document.body.style.backgroundImage =
              'linear-gradient(rgba(8, 5, 12, 0.60), rgba(8, 5, 12, 0.78)), url("' +
              path + '")';
          } else {
            element.src = path;
          }
        };

        test.onerror = tryNext;
        test.src = path;
      }

      tryNext();
    }

    // FOTO REDONDA DO PERFIL
    loadImageWithFallback(
      document.getElementById("profile-photo"),
      "fotoperfil"
    );

    // FOTO DE FUNDO DA PÁGINA
    loadImageWithFallback(
      null,
      "fotofundo",
      true
    );

    // ABRIR E FECHAR O MENU PLATAFORMAS

    const platformToggle = document.getElementById("platform-toggle");
    const platformMenu = document.getElementById("platform-menu");

    platformToggle.addEventListener("click", () => {
      const isOpen =
        platformToggle.getAttribute("aria-expanded") === "true";

      platformToggle.setAttribute("aria-expanded", String(!isOpen));

      platformMenu.classList.toggle("open", !isOpen);

      platformMenu.setAttribute("aria-hidden", String(isOpen));
      platformMenu.inert = isOpen;
    });

    // FECHAR O MENU COM A TECLA ESC

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        platformToggle.setAttribute("aria-expanded", "false");
        platformMenu.classList.remove("open");
        platformMenu.setAttribute("aria-hidden", "true");
        platformMenu.inert = true;
      }
    });
  </script>

</body>
</html>
